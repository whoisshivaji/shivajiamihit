<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Assistant</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #0b0f19;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      height: 100vh;
    }
    .chat-container {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      height: 100%;
      border-left: 1px solid #1e293b;
      border-right: 1px solid #1e293b;
    }
    header {
      padding: 16px;
      background: #111827;
      font-weight: 600;
      text-align: center;
      border-bottom: 1px solid #1f2937;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
    }
    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 10px;
      line-height: 1.5;
      font-size: 14.5px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .user {
      align-self: flex-end;
      background: #2563eb;
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }
    .bot {
      align-self: flex-start;
      background: #1f2937;
      color: #e5e7eb;
      border: 1px solid #374151;
      border-bottom-left-radius: 2px;
    }
    .input-bar {
      display: flex;
      padding: 14px;
      background: #111827;
      gap: 10px;
      border-top: 1px solid #1f2937;
    }
    input {
      flex: 1;
      background: #0b0f19;
      border: 1px solid #374151;
      padding: 12px 16px;
      border-radius: 8px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
    }
    input:focus {
      border-color: #3b82f6;
    }
    button {
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: background 0.2s;
    }
    button:hover {
      background: #1d4ed8;
    }
    button:disabled {
      background: #4b5563;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

<div class="chat-container">
  <header>AI Assistant (Powered by Groq)</header>
  <div class="chat-box" id="chatBox">
    <div class="msg bot">Namaste! Coding, scripts ya koi bhi sawal puchiye, superfast reply milega.</div>
  </div>
  <div class="input-bar">
    <input type="text" id="userInput" placeholder="Apna sawal ya code yahan likhein..." autocomplete="off" />
    <button id="sendBtn" onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
  const GROQ_API_KEY = "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";
  const MODEL_NAME = "llama-3.3-70b-versatile";

  // Conversation history taaki bot purani baat yaad rakhe
  let chatHistory = [
    { role: "system", content: "You are an expert coding and general AI assistant. Provide concise, clean, and accurate answers." }
  ];

  async function sendMessage() {
    const input = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const chatBox = document.getElementById("chatBox");
    const message = input.value.trim();

    if (!message) return;

    appendMessage("user", message);
    chatHistory.push({ role: "user", content: message });
    
    input.value = "";
    sendBtn.disabled = true;

    const loadingDiv = appendMessage("bot", "Thinking...");

    try {
      const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${GROQ_API_KEY}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          model: MODEL_NAME,
          messages: chatHistory,
          max_tokens: 1500
        })
      });

      const data = await res.json();

      if (data.choices && data.choices[0]) {
        const reply = data.choices[0].message.content;
        loadingDiv.innerText = reply;
        chatHistory.push({ role: "assistant", content: reply });
      } else if (data.error) {
        loadingDiv.innerText = "Error: " + (data.error.message || JSON.stringify(data.error));
      } else {
        loadingDiv.innerText = "Koi response nahi mila.";
      }
    } catch (err) {
      loadingDiv.innerText = "Network Error: " + err.message;
    } finally {
      sendBtn.disabled = false;
      chatBox.scrollTop = chatBox.scrollHeight;
      input.focus();
    }
  }

  function appendMessage(sender, text) {
    const chatBox = document.getElementById("chatBox");
    const msg = document.createElement("div");
    msg.className = `msg ${sender}`;
    msg.innerText = text;
    chatBox.appendChild(msg);
    chatBox.scrollTop = chatBox.scrollHeight;
    return msg;
  }

  document.getElementById("userInput").addEventListener("keypress", (e) => {
    if (e.key === "Enter") sendMessage();
  });
</script>

</body>
</html>
