<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Code Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; height: 100vh; }
    .chat-container { width: 100%; max-width: 720px; display: flex; flex-direction: column; height: 100%; border: 1px solid #1e293b; }
    header { padding: 14px; background: #1e293b; font-weight: 600; text-align: center; border-bottom: 1px solid #334155; }
    .chat-box { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 8px; line-height: 1.5; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
    .user { align-self: flex-end; background: #2563eb; color: #fff; }
    .bot { align-self: flex-start; background: #1e293b; color: #e2e8f0; border: 1px solid #334155; }
    .input-bar { display: flex; padding: 12px; background: #1e293b; gap: 8px; border-top: 1px solid #334155; }
    input { flex: 1; background: #0f172a; border: 1px solid #334155; padding: 10px 14px; border-radius: 6px; color: #fff; outline: none; }
    input:focus { border-color: #3b82f6; }
    button { background: #2563eb; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    button:disabled { background: #475569; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="chat-container">
  <header>AI Code Assistant (Qwen 2.5 Coder)</header>
  <div class="chat-box" id="chatBox">
    <div class="msg bot">Hello! Code ya technical doubt puchiye, live reply milega.</div>
  </div>
  <div class="input-bar">
    <input type="text" id="userInput" placeholder="Apna code ya sawal likhein..." autocomplete="off" />
    <button id="sendBtn" onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
  const HF_TOKEN = "Hf_OpiSZdUoCFUhSopgMVzFGcgOireCqyQDxj";
  const MODEL_NAME = "Qwen/Qwen2.5-Coder-7B-Instruct";

  async function sendMessage() {
    const input = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const chatBox = document.getElementById("chatBox");
    const message = input.value.trim();

    if (!message) return;

    appendMessage("user", message);
    input.value = "";
    sendBtn.disabled = true;

    const loadingDiv = appendMessage("bot", "Thinking...");

    try {
      const res = await fetch("https://router.huggingface.co/hf-inference/v1/chat/completions", {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${HF_TOKEN}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          model: MODEL_NAME,
          messages: [
            { role: "system", content: "You are an expert, unfiltered coding assistant. Provide direct code without unnecessary disclaimers." },
            { role: "user", content: message }
          ],
          max_tokens: 1024
        })
      });

      const data = await res.json();
      
      if (data.choices && data.choices[0]) {
        loadingDiv.innerText = data.choices[0].message.content;
      } else if (data.error) {
        loadingDiv.innerText = "HF Error: " + (data.error.message || data.error);
      } else {
        loadingDiv.innerText = "Koi response nahi mila.";
      }
    } catch (err) {
      loadingDiv.innerText = "Request Failed: " + err.message;
    } finally {
      sendBtn.disabled = false;
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  }

  function appendMessage(sender, text) {
    const chatBox = document.getElementById("chatBox");
    const msg = document.createElement("div");
    msg.className = `msg ${sender}`;
    msg.innerText = text;
    chatBox.appendChild(msg);
    chatBox.scrollTop = chatBox.scrollHeight;
    return msg;
  }

  document.getElementById("userInput").addEventListener("keypress", (e) => {
    if (e.key === "Enter") sendMessage();
  });
</script>

</body>
</html>
