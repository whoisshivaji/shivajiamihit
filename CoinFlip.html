<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>₹1 Coin Flip</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #141913;
    }
    #stage-wrap {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: radial-gradient(circle at 50% 30%, #2a3428 0%, #151b14 70%, #0d110c 100%);
      touch-action: none;
      cursor: pointer;
    }
    #coin-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="stage-wrap">
    <canvas id="coin-canvas"></canvas>
  </div>

  <script>
    (() => {
      // ---------- Constants & Surface Profile (Polished Wood Desk) ----------
      const SCALE = 2.2;
      const R = 1.0965 * SCALE;
      const T = 0.145 * SCALE;
      const HALF_T = T * 0.5;
      const MASS = 3.76;

      const I_Y = 0.5 * MASS * R * R;
      const I_XZ = 0.25 * MASS * R * R + (1 / 12) * MASS * T * T;

      const SURFACE = { e: 0.46, mu: 0.38 };
      const GRAVITY_MPS2 = 9.81;

      const state = {
        flipping: false,
        settled: true,
        pos: new THREE.Vector3(0, HALF_T, 0),
        vel: new THREE.Vector3(0, 0, 0),
        quat: new THREE.Quaternion(),
        omega: new THREE.Vector3(0, 0, 0),
        lastClinkTime: 0
      };

      const stageWrap = document.getElementById('stage-wrap');
      const canvas = document.getElementById('coin-canvas');

      // ---------- Procedural Web Audio Synthesizer ----------
      let audioCtx = null;
      function ensureAudio() {
        if (!audioCtx) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (Ctx) audioCtx = new Ctx();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume().catch(() => {});
        }
        return audioCtx;
      }

      function playFlickSound() {
        const ctx = ensureAudio();
        if (!ctx) return;
        const now = ctx.currentTime;
        const freqs = [3180, 4790, 6520];
        freqs.forEach((f, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f + (Math.random() - 0.5) * 40, now);
          gain.gain.setValueAtTime(0.08 / (idx + 1), now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.42 - idx * 0.08);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.45);
        });
      }

      function playBounceSound(impactSpeed) {
        const ctx = ensureAudio();
        if (!ctx) return;
        const now = ctx.currentTime;
        if (now - state.lastClinkTime < 0.028) return;
        state.lastClinkTime = now;

        const vol = Math.min(0.28, Math.max(0.015, impactSpeed / 420));
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        const baseF = 1650;
        osc.frequency.setValueAtTime(baseF * (0.9 + Math.random() * 0.25), now);
        osc.frequency.exponentialRampToValueAtTime(baseF * 0.55, now + 0.055);
        gain.gain.setValueAtTime(vol, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.065);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.07);
      }

      // ---------- Three.js Scene Setup ----------
      if (typeof THREE === 'undefined') return;

      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputEncoding = THREE.sRGBEncoding;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 300);
      camera.position.set(0, 19, 21);
      camera.lookAt(0, 1.5, 0);

      // Lighting
      const ambient = new THREE.AmbientLight(0xffffff, 0.65);
      scene.add(ambient);

      const keyLight = new THREE.DirectionalLight(0xfffcf2, 1.15);
      keyLight.position.set(12, 34, 14);
      keyLight.castShadow = true;
      keyLight.shadow.mapSize.width = 1024;
      keyLight.shadow.mapSize.height = 1024;
      keyLight.shadow.camera.near = 5;
      keyLight.shadow.camera.far = 70;
      const d = 16;
      keyLight.shadow.camera.left = -d;
      keyLight.shadow.camera.right = d;
      keyLight.shadow.camera.top = d;
      keyLight.shadow.camera.bottom = -d;
      keyLight.shadow.bias = -0.0005;
      scene.add(keyLight);

      const rimLight = new THREE.DirectionalLight(0xbbe8a0, 0.5);
      rimLight.position.set(-14, 12, -12);
      scene.add(rimLight);

      // Procedural Subtle Wood Table Texture
      function createWoodTableTexture() {
        const c = document.createElement('canvas');
        c.width = 512;
        c.height = 512;
        const g = c.getContext('2d');
        g.fillStyle = '#4a3525';
        g.fillRect(0, 0, 512, 512);
        for (let y = 0; y < 512; y += 2) {
          const shade = 62 + Math.sin(y * 0.07) * 8 + (Math.random() - 0.5) * 6;
          g.fillStyle = `rgba(${shade + 16}, ${shade}, ${shade - 18}, 0.35)`;
          g.fillRect(0, y, 512, 2);
        }
        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(3, 3);
        tex.encoding = THREE.sRGBEncoding;
        return tex;
      }

      // Full-view Table Surface
      const tableGeo = new THREE.CylinderGeometry(24, 24, 0.6, 72);
      const tableMat = new THREE.MeshStandardMaterial({
        map: createWoodTableTexture(),
        roughness: 0.72,
        metalness: 0.06
      });
      const tableMesh = new THREE.Mesh(tableGeo, tableMat);
      tableMesh.position.y = -0.3;
      tableMesh.receiveShadow = true;
      scene.add(tableMesh);

      // Procedural Milled Coin Edge Texture
      function createMilledRimTexture() {
        const c = document.createElement('canvas');
        c.width = 512;
        c.height = 32;
        const g = c.getContext('2d');
        g.fillStyle = '#9aa3ad';
        g.fillRect(0, 0, c.width, c.height);
        for (let x = 0; x < c.width; x += 4) {
          g.fillStyle = x % 8 === 0 ? '#d8dee6' : '#656e78';
          g.fillRect(x, 0, 2, c.height);
        }
        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = THREE.RepeatWrapping;
        tex.repeat.set(3, 1);
        return tex;
      }

      function loadDataTexture(src) {
        const tex = new THREE.Texture();
        const img = new Image();
        img.onload = () => {
          tex.image = img;
          tex.encoding = THREE.sRGBEncoding;
          tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
          tex.needsUpdate = true;
        };
        img.src = src;
        return tex;
      }

      function handleResize() {
        const w = window.innerWidth || 640;
        const h = window.innerHeight || 480;
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        // Pull camera slightly back on narrow portrait screens so full jump stays in view
        const aspectFactor = camera.aspect < 1 ? (1 / camera.aspect) * 0.42 : 0;
        camera.position.z = 21 + aspectFactor * 6;
        camera.updateProjectionMatrix();
      }
      window.addEventListener('resize', handleResize);
      handleResize();

      // ---------- 24-Point Rim Sampling for True 3D Collision ----------
      const RIM_POINTS = [];
      const SAMPLES = 24;
      for (let i = 0; i < SAMPLES; i++) {
        const a = (i / SAMPLES) * Math.PI * 2;
        const cx = Math.cos(a) * R;
        const cz = Math.sin(a) * R;
        RIM_POINTS.push(new THREE.Vector3(cx, +HALF_T, cz));
        RIM_POINTS.push(new THREE.Vector3(cx, -HALF_T, cz));
      }

      const _v = new THREE.Vector3();
      const _r = new THREE.Vector3();
      const _vc = new THREE.Vector3();
      const _vt = new THREE.Vector3();
      const _n = new THREE.Vector3(0, 1, 0);
      const _dq = new THREE.Quaternion();
      const _tmp1 = new THREE.Vector3();
      const _tmp2 = new THREE.Vector3();
      const _upLocal = new THREE.Vector3(0, 1, 0);

      function applyWorldInvInertia(vec, q, out) {
        const invQ = q.clone().invert();
        out.copy(vec).applyQuaternion(invQ);
        out.x /= I_XZ;
        out.y /= I_Y;
        out.z /= I_XZ;
        out.applyQuaternion(q);
        return out;
      }

      function stepPhysics(dt) {
        if (state.settled) return;

        const gUnits = GRAVITY_MPS2 * 100 * SCALE * 0.14;

        // 1. Gravity + Quadratic Air Drag
        const speed = state.vel.length();
        state.vel.y -= gUnits * dt;
        if (speed > 0.01) {
          state.vel.addScaledVector(state.vel, -0.0022 * speed * dt);
        }
        state.omega.multiplyScalar(Math.exp(-0.14 * dt));

        // 2. Integrate Position & Quaternion
        state.pos.addScaledVector(state.vel, dt);

        const wLen = state.omega.length();
        if (wLen > 1e-6) {
          const halfAngle = 0.5 * wLen * dt;
          const s = Math.sin(halfAngle) / wLen;
          _dq.set(state.omega.x * s, state.omega.y * s, state.omega.z * s, Math.cos(halfAngle));
          state.quat.premultiply(_dq).normalize();
        }

        // 3. Rim Collision Detection & Rigid-Body Impulse
        let minY = Infinity;
        let deepestLocal = null;

        for (let i = 0; i < RIM_POINTS.length; i++) {
          _v.copy(RIM_POINTS[i]).applyQuaternion(state.quat).add(state.pos);
          if (_v.y < minY) {
            minY = _v.y;
            deepestLocal = RIM_POINTS[i];
          }
        }

        if (minY < 0 && deepestLocal) {
          state.pos.y -= minY;
          _r.copy(deepestLocal).applyQuaternion(state.quat);
          _vc.crossVectors(state.omega, _r).add(state.vel);
          const vn = _vc.y;

          if (vn < 0) {
            _tmp1.crossVectors(_r, _n);
            applyWorldInvInertia(_tmp1, state.quat, _tmp2);
            _tmp2.cross(_r);
            const denom = (1 / MASS) + _tmp2.y;

            const e = Math.abs(vn) > 12 ? SURFACE.e : 0;
            const jn = -(1 + e) * vn / denom;

            if (Math.abs(vn) > 14) {
              playBounceSound(Math.abs(vn));
            }

            state.vel.y += jn / MASS;
            _tmp1.crossVectors(_r, _n).multiplyScalar(jn);
            applyWorldInvInertia(_tmp1, state.quat, _tmp2);
            state.omega.add(_tmp2);

            _vt.set(_vc.x, 0, _vc.z);
            const vtLen = _vt.length();
            if (vtLen > 1e-4) {
              _vt.divideScalar(vtLen);
              _tmp1.crossVectors(_r, _vt);
              applyWorldInvInertia(_tmp1, state.quat, _tmp2);
              _tmp2.cross(_r);
              const denomT = (1 / MASS) + _tmp2.dot(_vt);
              let jt = -vtLen / denomT;
              const maxJt = SURFACE.mu * jn;
              if (Math.abs(jt) > maxJt) jt = -maxJt;

              state.vel.addScaledVector(_vt, jt / MASS);
              _tmp1.crossVectors(_r, _vt).multiplyScalar(jt);
              applyWorldInvInertia(_tmp1, state.quat, _tmp2);
              state.omega.add(_tmp2);
            }
          }

          if (Math.abs(state.vel.y) < 18) {
            state.omega.multiplyScalar(Math.exp(-5.5 * dt));
            state.vel.x *= Math.exp(-6.0 * dt);
            state.vel.z *= Math.exp(-6.0 * dt);

            _tmp1.set(0, MASS * gUnits * dt * 0.55, 0);
            _tmp2.crossVectors(_r, _tmp1);
            applyWorldInvInertia(_tmp2, state.quat, _tmp1);
            state.omega.add(_tmp1);
          }
        }

        // Keep coin inside visible table area
        const distXZ = Math.hypot(state.pos.x, state.pos.z);
        if (distXZ > 10.5) {
          const nx = state.pos.x / distXZ;
          const nz = state.pos.z / distXZ;
          state.pos.x = nx * 10.5;
          state.pos.z = nz * 10.5;
          state.vel.x *= -0.5;
          state.vel.z *= -0.5;
        }

        // 4. Settled Check (snappy settle once coin lands flat)
        const upWorld = _upLocal.clone().applyQuaternion(state.quat);
        const flatDot = Math.abs(upWorld.y);
        if (
          state.pos.y <= HALF_T + 0.12 &&
          Math.abs(state.vel.y) < 3.5 &&
          state.vel.lengthSq() < 12.0 &&
          state.omega.lengthSq() < 4.5 &&
          flatDot > 0.985
        ) {
          state.vel.set(0, 0, 0);
          state.omega.set(0, 0, 0);
          state.pos.y = HALF_T;

          const isHeads = upWorld.y > 0;
          const euler = new THREE.Euler().setFromQuaternion(state.quat, 'YXZ');
          state.quat.setFromEuler(new THREE.Euler(isHeads ? 0 : Math.PI, euler.y, 0, 'YXZ'));
          state.flipping = false;
          state.settled = true;
        }
      }

      // ---------- Launch Coin Flip ----------
      function launchFlip(extraPower = 1.0) {
        const isAirborne = state.flipping && (state.pos.y > HALF_T + 0.65 || Math.abs(state.vel.y) > 10);
        if (isAirborne) return;
        ensureAudio();
        playFlickSound();

        state.flipping = true;
        state.settled = false;

        state.pos.set(
          (Math.random() - 0.5) * 0.5,
          HALF_T + 0.35,
          (Math.random() - 0.5) * 0.5
        );

        state.vel.set(
          (Math.random() - 0.5) * 4.5,
          (42 + Math.random() * 10) * extraPower,
          (Math.random() - 0.5) * 4.5
        );

        const flipAxisAngle = Math.random() * Math.PI * 2;
        const flipRate = (26 + Math.random() * 14) * extraPower;
        state.omega.set(
          Math.cos(flipAxisAngle) * flipRate,
          (Math.random() - 0.5) * 6.5,
          Math.sin(flipAxisAngle) * flipRate
        );
      }

      // ---------- Input Events (Tap, Swipe Up, Spacebar) ----------
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && !e.repeat) {
          e.preventDefault();
          launchFlip(1.0);
        }
      });

      let pointerDownY = null;
      let pointerDownTime = 0;
      stageWrap.addEventListener('pointerdown', (e) => {
        pointerDownY = e.clientY;
        pointerDownTime = performance.now();
      });
      stageWrap.addEventListener('pointerup', (e) => {
        if (pointerDownY === null) return;
        const dy = pointerDownY - e.clientY;
        const dt = Math.max(16, performance.now() - pointerDownTime);
        pointerDownY = null;
        if (dy > 20) {
          const swipeBoost = Math.min(1.35, Math.max(0.85, (dy / dt) * 1.4));
          launchFlip(swipeBoost);
        } else {
          launchFlip(1.0);
        }
      });

      // ---------- Main Animation Loop (240 Hz Fixed Sub-Stepping) ----------
      let lastTime = performance.now();
      let accumulator = 0;
      const FIXED_DT = 1 / 240;

      function animate(now) {
        requestAnimationFrame(animate);
        const frameDt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;

        if (!state.settled) {
          accumulator += frameDt;
          while (accumulator >= FIXED_DT) {
            stepPhysics(FIXED_DT);
            accumulator -= FIXED_DT;
          }
        } else {
          accumulator = 0;
        }

        coinMesh.position.copy(state.pos);
        coinMesh.quaternion.copy(state.quat);

        const targetCamY = 17 + Math.min(6, state.pos.y * 0.35);
        camera.position.y += (targetCamY - camera.position.y) * 0.1;
        camera.lookAt(state.pos.x * 0.25, Math.min(4.5, state.pos.y * 0.45 + 1.0), state.pos.z * 0.25);

        renderer.render(scene, camera);
      }

      // Start upright on Heads
      state.quat.setFromEuler(new THREE.Euler(0, Math.PI, 0));
      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
