<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tic Tac Toe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-page: #f2fbf6;
      --mint-board: #a5dfc1;
      --mint-line: #88cba9;
      --accent-green: #4fb984;
      --accent-pill: #71c89c;
      --dark-green: #1e4231;
      --muted-green: #587968;
      --card-bg: #ffffff;
      --o-cream: #fffdf5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-page);
      color: var(--dark-green);
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 16px 16px 24px;
      overflow-x: hidden;
    }

    .app-shell {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    /* Top Bar */
    .top-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 2px;
    }

    .brand-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-badge {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: var(--accent-pill);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(79, 185, 132, 0.28);
    }

    .brand-title {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--dark-green);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      border: none;
      background: transparent;
      color: #3b7d5c;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.12s ease;
    }

    .icon-btn:hover {
      background: rgba(113, 200, 156, 0.16);
    }

    .icon-btn:active {
      transform: scale(0.92);
    }

    /* Control Bar (Mode Dropdown + Symbol Toggle) */
    .control-bar {
      width: 100%;
      background: var(--card-bg);
      border-radius: 999px;
      padding: 6px 8px 6px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 16px rgba(30, 66, 49, 0.05);
      border: 1px solid rgba(136, 203, 169, 0.25);
      gap: 8px;
    }

    .select-wrap {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
    }

    .mode-select {
      width: 100%;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      border: none;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--dark-green);
      text-transform: uppercase;
      padding-right: 26px;
      cursor: pointer;
      outline: none;
    }

    .select-chevron {
      position: absolute;
      right: 6px;
      pointer-events: none;
      color: #4fb984;
      display: flex;
      align-items: center;
    }

    .side-toggle {
      display: flex;
      align-items: center;
      background: #f3faf6;
      border: 1px solid #d5eee1;
      border-radius: 999px;
      padding: 3px;
      gap: 2px;
    }

    .side-btn {
      width: 36px;
      height: 28px;
      border-radius: 999px;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--dark-green);
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .side-btn.active {
      background: var(--accent-green);
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(79, 185, 132, 0.35);
    }

    /* Grid Size Pills (3x3, 4x4, 5x5) */
    .size-bar {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      background: var(--card-bg);
      padding: 5px;
      border-radius: 999px;
      box-shadow: 0 4px 14px rgba(30, 66, 49, 0.04);
      border: 1px solid rgba(136, 203, 169, 0.25);
    }

    .size-btn {
      border: none;
      background: transparent;
      padding: 7px 0;
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      color: var(--muted-green);
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .size-btn.active {
      background: var(--accent-green);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(79, 185, 132, 0.32);
    }

    /* Score Cards */
    .score-row {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .score-card {
      background: var(--card-bg);
      border-radius: 18px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 2px solid transparent;
      box-shadow: 0 6px 18px rgba(30, 66, 49, 0.04);
      transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }

    .score-card.active-turn {
      border-color: #8fd4b0;
      box-shadow: 0 8px 20px rgba(79, 185, 132, 0.12);
    }

    .score-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .score-mark-x {
      width: 22px;
      height: 22px;
      color: var(--dark-green);
      flex-shrink: 0;
    }

    .score-mark-o {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 4px solid #f7f3e3;
      box-shadow: 0 0 0 1px rgba(30, 66, 49, 0.12);
      flex-shrink: 0;
    }

    .score-label {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: var(--muted-green);
      text-transform: uppercase;
      line-height: 1.2;
    }

    .score-val {
      font-size: 1.55rem;
      font-weight: 800;
      color: var(--dark-green);
      margin-left: 6px;
    }

    /* Turn Pill */
    .turn-pill {
      background: var(--card-bg);
      border-radius: 999px;
      padding: 7px 18px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(30, 66, 49, 0.06);
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--dark-green);
    }

    .turn-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent-green);
      transition: background 0.2s ease;
    }

    /* Board Container */
    .board-card {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: var(--mint-board);
      border-radius: 28px;
      padding: 22px;
      position: relative;
      box-shadow: 0 16px 34px rgba(55, 130, 92, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .board-grid {
      width: 100%;
      height: 100%;
      display: grid;
      position: relative;
    }

    .cell {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: none;
      background: transparent;
      padding: 0;
      outline: none;
    }

    /* Internal grid lines via borders */
    .cell.r-border {
      border-right: 6px solid var(--mint-line);
    }
    .cell.b-border {
      border-bottom: 6px solid var(--mint-line);
    }

    .board-grid.size-4 .cell.r-border {
      border-right-width: 5px;
    }
    .board-grid.size-4 .cell.b-border {
      border-bottom-width: 5px;
    }

    .board-grid.size-5 .cell.r-border {
      border-right-width: 4px;
    }
    .board-grid.size-5 .cell.b-border {
      border-bottom-width: 4px;
    }

    /* Animated X and O Marks */
    .mark-svg {
      width: 58%;
      height: 58%;
      overflow: visible;
      animation: popIn 0.18s cubic-bezier(0.24, 1.4, 0.5, 1) forwards;
    }

    .cell.win-cell .mark-svg {
      animation: winPulse 0.65s ease-in-out infinite alternate;
    }

    @keyframes popIn {
      0% {
        transform: scale(0.35);
        opacity: 0;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes winPulse {
      0% {
        transform: scale(1);
      }
      100% {
        transform: scale(1.14);
      }
    }

    /* Winning Strike Line Overlay */
    .win-line-svg {
      position: absolute;
      inset: 22px;
      width: calc(100% - 44px);
      height: calc(100% - 44px);
      pointer-events: none;
      z-index: 5;
    }

    .win-line {
      stroke: var(--dark-green);
      stroke-width: 5;
      stroke-linecap: round;
      stroke-dasharray: 200;
      stroke-dashoffset: 200;
      animation: drawLine 0.32s ease-out forwards;
    }

    @keyframes drawLine {
      to {
        stroke-dashoffset: 0;
      }
    }

    /* Restart Button */
    .restart-btn {
      margin-top: 2px;
      background: var(--card-bg);
      border: 1px solid rgba(136, 203, 169, 0.35);
      border-radius: 999px;
      padding: 13px 34px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--dark-green);
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(30, 66, 49, 0.07);
      transition: transform 0.14s ease, box-shadow 0.14s ease;
    }

    .restart-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 26px rgba(30, 66, 49, 0.11);
    }

    .restart-btn:active {
      transform: translateY(1px) scale(0.98);
    }

    /* Ties Footer */
    .ties-text {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--muted-green);
      margin-top: -2px;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Header -->
    <header class="top-bar">
      <div class="brand-left">
        <div class="logo-badge" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
            <line x1="6" y1="6" x2="18" y2="18" />
            <line x1="18" y1="6" x2="6" y2="18" />
          </svg>
        </div>
        <h1 class="brand-title">Tic Tac Toe</h1>
      </div>

      <div class="top-actions">
        <button id="sound-btn" class="icon-btn" type="button" title="Toggle Sound" aria-label="Toggle Sound">
          <svg id="sound-on-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
          </svg>
          <svg id="sound-off-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
            <line x1="23" y1="9" x2="17" y2="15" />
            <line x1="17" y1="9" x2="23" y2="15" />
          </svg>
        </button>

        <button id="top-reset-btn" class="icon-btn" type="button" title="Reset All Scores" aria-label="Reset All Scores">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />

        </button>
      </div>
    </header>

    <!-- Mode & Symbol Bar -->
    <div class="control-bar">

    <!-- Board Size Selector (3x3, 4x4, 5x5) -->
    <div class="size-bar" role="group" aria-label="Board Grid Size">
      <button type="button" class="size-btn active" data-size="3">3 × 3</button>

    <!-- Score Cards -->
    <div class="score-row">
      <div id="card-x" class="score-card active-turn">

          <svg class="score-mark-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round">
            <line x1="5" y1="5" x2="19" y2="19" />

          <span class="score-mark-o"></span>

        <span id="score-o" class="score-val">0</span>

    <!-- Turn Status Pill -->
    <div class="turn-pill">
      <span id="turn-dot" class="turn-dot"></span>
      <span id="turn-text">X's Turn</span>

    <!-- Mint Board -->
    <div class="board-card">
      <div id="board-grid" class="board-grid size-3"></div>
      <svg id="win-line-svg" class="win-line-svg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
    </div>

    <!-- Restart Game Button -->
    <button id="restart-btn" type="button" class="restart-btn">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#4fb984" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
        <path d="M3 3v5h5" />
      </svg>
      <span>RESTART GAME</span>
    </button>

    <!-- Ties Counter -->
    <div class="ties-text">Ties: <span id="score-ties">0</span></div>

  <script>
    (() => {
      // ---------- Game State ----------
      const state = {
        size: 3,              // 3, 4, or 5
        winLen: 3,            // 3 for 3x3, 4 for 4x4 and 5x5
        mode: 'hard',         // 'easy' | 'medium' | 'hard' | '2p'
        humanSide: 'X',       // 'X' | 'O'
        turn: 'X',            // 'X' always starts
        board: [],
        gameOver: false,
        aiThinking: false,
        soundOn: true,
        scores: { X: 0, O: 0, ties: 0 },
        winLines: []
      };

      // ---------- DOM Elements ----------
      const boardGrid = document.getElementById('board-grid');
      const winLineSvg = document.getElementById('win-line-svg');
      const modeSelect = document.getElementById('mode-select');
      const pickXBtn = document.getElementById('pick-x-btn');
      const pickOBtn = document.getElementById('pick-o-btn');
      const sizeBtns = document.querySelectorAll('.size-btn');
      const cardX = document.getElementById('card-x');
      const cardO = document.getElementById('card-o');
      const labelX = document.getElementById('label-x');
      const labelO = document.getElementById('label-o');
      const scoreXEl = document.getElementById('score-x');
      const scoreOEl = document.getElementById('score-o');
      const scoreTiesEl = document.getElementById('score-ties');
      const turnTextEl = document.getElementById('turn-text');
      const turnDotEl = document.getElementById('turn-dot');
      const restartBtn = document.getElementById('restart-btn');
      const topResetBtn = document.getElementById('top-reset-btn');
      const soundBtn = document.getElementById('sound-btn');
      const soundOnIcon = document.getElementById('sound-on-icon');
      const soundOffIcon = document.getElementById('sound-off-icon');

      let aiTimer = null;

      // ---------- Web Audio API Sound Effects ----------
      let audioCtx = null;
      function getAudio() {
        if (!state.soundOn) return null;
        if (!audioCtx) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (Ctx) audioCtx = new Ctx();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume().catch(() => {});
        }
        return audioCtx;
      }

      function playMoveSound(side) {
        const ctx = getAudio();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        const base = side === 'X' ? 520 : 420;
        osc.frequency.setValueAtTime(base, now);
        osc.frequency.exponentialRampToValueAtTime(base * 1.32, now + 0.065);
        gain.gain.setValueAtTime(0.11, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.075);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.08);
      }

      function playEndSound(type) {
        const ctx = getAudio();
        if (!ctx) return;
        const now = ctx.currentTime;
        const notes = type === 'win' ? [523.25, 659.25, 783.99] : [360, 300];
        notes.forEach((f, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(f, now + idx * 0.085);
          gain.gain.setValueAtTime(0.12, now + idx * 0.085);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.085 + 0.22);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + idx * 0.085);
          osc.stop(now + idx * 0.085 + 0.24);
        });
      }

      // ---------- Precompute All Winning Lines for N x N Board ----------
      // 3x3 -> 3 in a row; 4x4 -> 4 in a row; 5x5 -> 4 in a row (for deep tactical gameplay)
      function buildWinLines(n, k) {
        const lines = [];
        // Rows
        for (let r = 0; r < n; r++) {
          for (let c = 0; c <= n - k; c++) {
            const line = [];
            for (let i = 0; i < k; i++) line.push(r * n + (c + i));
            lines.push(line);
          }
        }
        // Columns
        for (let c = 0; c < n; c++) {
          for (let r = 0; r <= n - k; r++) {
            const line = [];
            for (let i = 0; i < k; i++) line.push((r + i) * n + c);
            lines.push(line);
          }
        }
        // Down-Right Diagonals
        for (let r = 0; r <= n - k; r++) {
          for (let c = 0; c <= n - k; c++) {
            const line = [];
            for (let i = 0; i < k; i++) line.push((r + i) * n + (c + i));
            lines.push(line);
          }
        }
        // Down-Left Diagonals
        for (let r = 0; r <= n - k; r+
