<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Primary Meta Tags -->
  <title>Shivaji | Official Portfolio</title>
  <meta name="title" content="Shivaji | Official Portfolio">
  <meta name="description" content="Official personal portfolio of Shivaji - Packaging Operator, Web Developer & Tech Enthusiast.">

  <!-- Open Graph / WhatsApp / Facebook Preview Tags -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://shivajiamihit.in/">
  <meta property="og:title" content="Shivaji | Official Portfolio">
  <meta property="og:description" content="Connect with Shivaji. View my portfolio, contact details, and social links.">
  <meta property="og:image" content="https://shivajiamihit.in/profile.jpg">

  <!-- Twitter / X Meta Tags -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://shivajiamihit.in/">
  <meta property="twitter:title" content="Shivaji | Official Portfolio">
  <meta property="twitter:description" content="Connect with Shivaji. View my portfolio, contact details, and social links.">
  <meta property="twitter:image" content="https://shivajiamihit.in/profile.jpg">

  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border-radius: 24px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .profile-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent);
      box-shadow: 0 0 20px var(--accent-glow);
      margin-bottom: 16px;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    /* Save Contact Button */
    .save-contact-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      background: linear-gradient(135deg, #25D366, #128C7E);
      color: #ffffff;
      padding: 14px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(37, 211, 102, 0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      margin-bottom: 25px;
    }

    .save-contact-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(37, 211, 102, 0.4);
    }

    /* Social Links List */
    .links-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      transition: all 0.25s ease;
    }

    .link-item:hover {
      background: rgba(56, 189, 248, 0.1);
      border-color: var(--accent);
      transform: translateX(4px);
    }

    .link-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .link-left i {
      font-size: 20px;
      width: 24px;
      text-align: center;
    }

    /* Brand Colors */
    .fa-whatsapp { color: #25D366; }
    .fa-phone { color: #38bdf8; }
    .fa-envelope { color: #ea4335; }
    .fa-instagram { color: #e1306c; }
    .fa-telegram { color: #229ED9; }
    .fa-chevron-right { color: var(--text-muted); font-size: 12px; }

    footer {
      margin-top: 28px;
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Profile Photo (Make sure 'profile.jpg' exists in your repo or replace with your image URL) -->
    <img src="profile.jpg" alt="Shivaji" class="profile-img" onerror="this.src='https://ui-avatars.com/api/?name=Shivaji+Kumar&background=38bdf8&color=0f172a&size=200'">

    <h1>Shivaji Kumar</h1>
    <p class="subtitle">Operator & Tech Enthusiast | Amihit, Jaunpur</p>

    <!-- One-Click Save Contact Button -->
    <button onclick="downloadVCard()" class="save-contact-btn">
      <i class="fa-solid fa-address-card"></i> Save Contact
    </button>

    <!-- Social & Contact Deep Links -->
    <div class="links-list">
      <!-- WhatsApp Direct Chat Link -->
      <a href="https://api.whatsapp.com/send?phone=919792156988&text=Hi%20Shivaji!" target="_blank" class="link-item">
        <div class="link-left">
          <i class="fa-brands fa-whatsapp"></i>
          <span>WhatsApp</span>
        </div>
        <i class="fa-solid fa-chevron-right"></i>
      </a>

      <!-- Direct Phone Call -->
      <a href="tel:+919792156988" class="link-item">
        <div class="link-left">
          <i class="fa-solid fa-phone"></i>
          <span>Call Me</span>
        </div>
        <i class="fa-solid fa-chevron-right"></i>
      </a>

      <!-- Direct Email Link -->
      <a href="mailto:shivajiraoamihit786@gmail.com?subject=Contact%20from%20Portfolio" class="link-item">
        <div class="link-left">
          <i class="fa-solid fa-envelope"></i>
          <span>Email Me</span>
        </div>
        <i class="fa-solid fa-chevron-right"></i>
      </a>

      <!-- Instagram Direct Deep Link (Username replace karein agar alag ho) -->
      <a href="instagram://user?username=whoisshivaji" onclick="window.location='https://instagram.com/whoisshivaji';" class="link-item">
        <div class="link-left">
          <i class="fa-brands fa-instagram"></i>
          <span>Instagram</span>
        </div>
        <i class="fa-solid fa-chevron-right"></i>
      </a>

      <!-- Telegram Direct Link (Username replace karein) -->
      <a href="tg://resolve?domain=whoisshivaji" onclick="window.location='https://t.me/whoisshivaji';" class="link-item">
        <div class="link-left">
          <i class="fa-brands fa-telegram"></i>
          <span>Telegram</span>
        </div>
        <i class="fa-solid fa-chevron-right"></i>
      </a>
    </div>

    <footer>
      © 2026 shivajiamihit.in • All Rights Reserved
    </footer>
  </div>

  <!-- JavaScript to Generate and Download vCard (.vcf) -->
  <script>
    function downloadVCard() {
      const vcard = 
`BEGIN:VCARD
VERSION:3.0
N:Kumar;Shivaji;;;
FN:Shivaji Kumar
ORG:Personal
TITLE:Packaging Operator & Tech Enthusiast
TEL;TYPE=CELL,VOICE:+919792156988
EMAIL;TYPE=INTERNET:shivajiraoamihit786@gmail.com
URL:https://shivajiamihit.in
ADR;TYPE=HOME:;;Amihit, Kerakat;Jaunpur;Uttar Pradesh;222142;India
END:VCARD`;

      const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const tempLink = document.createElement('a');
      tempLink.href = url;
      tempLink.setAttribute('download', 'Shivaji_Kumar.vcf');
      document.body.appendChild(tempLink);
      tempLink.click();
      document.body.removeChild(tempLink);
      URL.revokeObjectURL(url);
    }
  </script>

</body>
</html>
