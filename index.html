<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Meta Tags -->
  <title>SHIVAJI | Web Apps & Tools</title>
  <meta name="title" content="SHIVAJI | Web Apps & Tools">
  <meta name="description" content="Personal app launcher and tools dashboard by Shivaji.">

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #030712;
      color: #f9fafb;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px 16px 40px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient Liquid Orbs */
    .liquid-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(85px);
      z-index: 0;
      opacity: 0.5;
      pointer-events: none;
      animation: floatOrb 15s infinite alternate ease-in-out;
    }

    .orb-1 {
      width: 300px;
      height: 300px;
      background: linear-gradient(135deg, #0ea5e9, #38bdf8);
      top: -50px;
      left: -50px;
    }

    .orb-2 {
      width: 340px;
      height: 340px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      bottom: -70px;
      right: -70px;
      animation-duration: 18s;
    }

    .orb-3 {
      width: 240px;
      height: 240px;
      background: linear-gradient(135deg, #10b981, #06b6d4);
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation-duration: 12s;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(25px, 35px) scale(1.1); }
      100% { transform: translate(-25px, -20px) scale(0.95); }
    }

    /* Main Container */
    .app-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.6),
        inset 0 1px 1px rgba(255, 255, 255, 0.2);
      padding: 20px 18px 28px;
    }

    /* Top Bar: Mini Avatar + Name */
    .top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.09);
      margin-bottom: 22px;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar-mini {
      position: relative;
      width: 44px;
      height: 44px;
    }

    .avatar-mini img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(56, 189, 248, 0.6);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.35);
    }

    .online-badge {
      position: absolute;
      bottom: 1px;
      right: 1px;
      width: 11px;
      height: 11px;
      background: #10b981;
      border: 2px solid #030712;
      border-radius: 50%;
    }

    .brand-name {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 1.5px;
      background: linear-gradient(135deg, #ffffff 30%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .hub-status {
      font-size: 11px;
      padding: 5px 11px;
      border-radius: 20px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* Section Header */
    .section-headline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
      margin-bottom: 16px;
    }

    .section-headline span {
      font-size: 13px;
      font-weight: 700;
      color: #cbd5e1;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .app-counter {
      font-size: 11px;
      color: #94a3b8;
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 8px;
      border-radius: 12px;
    }

    /* Mobile App Grid (2 Columns) */
    .apps-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      min-height: 180px;
    }

    /* App Card Styling */
    .app-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 12px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 22px;
      text-decoration: none;
      color: #f1f5f9;
      transition: all 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .app-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
    }

    .app-card:hover, .app-card:active {
      transform: translateY(-4px) scale(1.02);
      border-color: rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
    }

    /* Squircle App Icon */
    .app-icon {
      width: 54px;
      height: 54px;
      border-radius: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: transform 0.3s ease;
    }

    .app-card:hover .app-icon {
      transform: scale(1.1) rotate(-4deg);
    }

    .app-title {
      font-size: 13.5px;
      font-weight: 600;
      color: #f8fafc;
      text-align: center;
      line-height: 1.3;
      margin-bottom: 3px;
    }

    .app-subtitle {
      font-size: 10.5px;
      color: #94a3b8;
      text-transform: capitalize;
    }

    /* Vibrant Themes */
    .icon-cyan   { background: linear-gradient(135deg, #06b6d4, #0284c7); color: #fff; }
    .icon-emerald{ background: linear-gradient(135deg, #10b981, #059669); color: #fff; }
    .icon-purple { background: linear-gradient(135deg, #a855f7, #6366f1); color: #fff; }
    .icon-amber  { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; }
    .icon-rose   { background: linear-gradient(135deg, #f43f5e, #e11d48); color: #fff; }
    .icon-blue   { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: #fff; }
    .icon-teal   { background: linear-gradient(135deg, #14b8a6, #0d9488); color: #fff; }

    .loading-state {
      grid-column: span 2;
      text-align: center;
      padding: 40px 10px;
      color: #94a3b8;
      font-size: 13px;
    }

    footer {
      text-align: center;
      margin-top: 26px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.35);
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <!-- Ambient Glowing Blobs -->
  <div class="liquid-orb orb-1"></div>
  <div class="liquid-orb orb-2"></div>
  <div class="liquid-orb orb-3"></div>

  <!-- App Drawer Container -->
  <div class="app-container">
    
    <!-- Top Bar: Avatar & Brand -->
    <header class="top-header">
      <div class="user-profile">
        <div class="avatar-mini">
          <img src="profile.jpg" alt="Shivaji" onerror="this.src='https://ui-avatars.com/api/?name=Shivaji&background=0284c7&color=ffffff'">
          <span class="online-badge"></span>
        </div>
        <div class="brand-name">SHIVAJI</div>
      </div>
      <div class="hub-status">App Hub</div>
    </header>

    <!-- Apps Header -->
    <div class="section-headline">
      <span><i class="fa-solid fa-shapes" style="color: #38bdf8;"></i> All Applications</span>
      <span class="app-counter" id="appCounter">Syncing...</span>
    </div>

    <!-- Live Dynamic Apps Grid -->
    <div class="apps-grid" id="appsGrid">
      <div class="loading-state">
        <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 26px; color: #38bdf8; margin-bottom: 10px;"></i>
        <p>Loading your apps...</p>
      </div>
    </div>

    <footer>
      © 2026 SHIVAJI • Apps Hub
    </footer>

  </div>

  <!-- Real-Time GitHub Sync Script -->
  <script>
    const GITHUB_USER = 'whoisshivaji';
    const GITHUB_REPO = 'shivajiamihit';
    const grid = document.getElementById('appsGrid');
    const counter = document.getElementById('appCounter');

    // Tool name, icon, and theme detector
    function resolveAppInfo(filename) {
      const lower = filename.toLowerCase();
      
      if (lower.includes('ludo')) return { title: 'Play Ludo 🎲', desc: 'Game', icon: 'fa-dice', color: 'icon-amber' };
      if (lower.includes('aichat')) return { title: 'AI Chatbot', desc: 'Smart AI', icon: 'fa-robot', color: 'icon-purple' };
      if (lower.includes('life')) return { title: 'Life Calculator', desc: 'Age & Stats', icon: 'fa-heart-pulse', color: 'icon-rose' };
      if (lower.includes('calc')) return { title: 'Smart Calculator', desc: 'Math Utility', icon: 'fa-calculator', color: 'icon-blue' };
      if (lower.includes('dslr') || lower.includes('blur')) return { title: 'DSLR Blur', desc: 'Photo Editor', icon: 'fa-camera-retro', color: 'icon-cyan' };
      if (lower.includes('download')) return { title: 'Downloader', desc: 'Media Tool', icon: 'fa-circle-arrow-down', color: 'icon-emerald' };
      if (lower.includes('vector')) return { title: 'Vector Portrait', desc: 'Art Utility', icon: 'fa-palette', color: 'icon-purple' };
      if (lower.includes('portrait')) return { title: 'Portrait Tool', desc: 'Photo FX', icon: 'fa-wand-magic-sparkles', color: 'icon-rose' };
      if (lower.includes('qr')) return { title: 'QR Tool', desc: 'Code Utility', icon: 'fa-qrcode', color: 'icon-teal' };
      if (lower.includes('video') || lower.includes('player')) return { title: 'Video Player', desc: 'Media Stream', icon: 'fa-circle-play', color: 'icon-rose' };
      if (lower.includes('chat')) return { title: 'Live Chat', desc: 'Messenger', icon: 'fa-comments', color: 'icon-cyan' };

      // Default fallback for any newly uploaded HTML file
      const cleanName = filename.replace(/\.html$/i, '').replace(/[-_]/g, ' ');
      const capitalized = cleanName.charAt(0).toUpperCase() + cleanName.slice(1);
      return { title: capitalized, desc: 'Web App', icon: 'fa-cube', color: 'icon-cyan' };
    }

    async function syncApps() {
      try {
        // Cache bypass timestamp to fetch real-time state from GitHub
        const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/?t=${Date.now()}`);
        if (!response.ok) throw new Error('API fetch error');
        const files = await response.json();

        // Filter only valid HTML tools, excluding index and duplicates
        const validTools = files.filter(file => {
          if (file.type !== 'file') return false;
          const name = file.name.toLowerCase();
          return name.endsWith('.html') && name !== 'index.html' && name !== 'lifecalculator.html';
        });

        grid.innerHTML = '';
        validTools.forEach(file => {
          const meta = resolveAppInfo(file.name);
          const card = document.createElement('a');
          card.href = file.name;
          card.className = 'app-card';
          card.innerHTML = `
            <div class="app-icon ${meta.color}"><i class="fa-solid ${meta.icon}"></i></div>
            <div class="app-title">${meta.title}</div>
            <div class="app-subtitle">${meta.desc}</div>
          `;
          grid.appendChild(card);
        });

        counter.textContent = validTools.length + ' Apps';
        
        // Save to localStorage for instant offline/cached rendering next time
        localStorage.setItem('cached_tools', JSON.stringify(validTools.map(f => f.name)));

      } catch (err) {
        // Fallback to cached tools if GitHub API rate limits or network issues occur
        const cached = JSON.parse(localStorage.getItem('cached_tools') || '[]');
        if (cached.length > 0) {
          grid.innerHTML = '';
          cached.forEach(fileName => {
            const meta = resolveAppInfo(fileName);
            const card = document.createElement('a');
            card.href = fileName;
            card.className = 'app-card';
            card.innerHTML = `
              <div class="app-icon ${meta.color}"><i class="fa-solid ${meta.icon}"></i></div>
              <div class="app-title">${meta.title}</div>
              <div class="app-subtitle">${meta.desc}</div>
            `;
            grid.appendChild(card);
          });
          counter.textContent = cached.length + ' Apps';
        } else {
          grid.innerHTML = '<div class="loading-state"><p>Unable to load apps. Please refresh.</p></div>';
        }
      }
    }

    syncApps();
  </script>

</body>
</html>
