  <style>
    :root {
      --bg-color: #0b1120;
      --card-bg: #151e32;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border-radius: 28px;
      padding: 32px 20px;
      text-align: center;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .profile-img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent);
      margin-bottom: 14px;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.35);
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    /* Save Contact Button */
    .save-contact-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      padding: 13px;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(16, 185, 129, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      margin-bottom: 22px;
    }

    .save-contact-btn:hover {
      transform: translateY(-2px);
    }

    /* Links Container */
    .links-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .link-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .link-item:hover {
      background: rgba(56, 189, 248, 0.08);
      border-color: rgba(56, 189, 248, 0.3);
      transform: translateX(4px);
    }

    .link-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .link-left i {
      font-size: 19px;
      width: 22px;
      text-align: center;

    .fa-envelope { color: #ea4335; }
    .fa-instagram { color: #e1306c; }

    .fa-facebook { color: #1877f2; }

    .fa-github { color: #ffffff; }

  <!-- vCard Script -->
  <script>
    function downloadVCard() {
      const vcard = 
`BEGIN:VCARD
VERSION:3.0
N:Kumar;Shivaji;;;
FN:Shivaji Kumar
ORG:Personal
TITLE:Packaging Operator & Tech Enthusiast
TEL;TYPE=CELL,VOICE:+919792156988
EMAIL;TYPE=INTERNET:shivajiraoamihit786@gmail.com
URL:https://shivajiamihit.in
ADR;TYPE=HOME:;;Amihit, Kerakat;Jaunpur;Uttar Pradesh;222142;India
END:VCARD`;

      const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const tempLink = document.createElement('a');
      tempLink.href = url;
      tempLink.setAttribute('download', 'Shivaji_Kumar.vcf');
      document.body.appendChild(tempLink);
      tempLink.click();
      document.body.removeChild(tempLink);
      URL.revokeObjectURL(url);
    }
  </script>
