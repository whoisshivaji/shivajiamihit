  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background: #030712;
      color: #f9fafb;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* Animated Liquid Blobs in Background */
    .liquid-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      opacity: 0.6;
      animation: floatOrb 12s infinite alternate ease-in-out;
    }

    .orb-1 {
      width: 320px;
      height: 320px;
      background: linear-gradient(135deg, #0ea5e9, #38bdf8);
      top: -60px;
      left: -60px;
    }

    .orb-2 {
      width: 380px;
      height: 380px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      bottom: -80px;
      right: -80px;
      animation-duration: 16s;
    }

    .orb-3 {
      width: 250px;
      height: 250px;
      background: linear-gradient(135deg, #10b981, #06b6d4);
      top: 45%;
      left: 60%;
      animation-duration: 10s;
    }

    @keyframes floatOrb {
      0% {
        transform: translate(0, 0) scale(1);
      }
      50% {
        transform: translate(30px, 40px) scale(1.15);
      }
      100% {
        transform: translate(-30px, -20px) scale(0.95);
      }
    }

    /* Liquid Glass Card Container */
    .glass-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(24px) saturate(190%);
      -webkit-backdrop-filter: blur(24px) saturate(190%);
      border-radius: 32px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.6),
        inset 0 1px 1px rgba(255, 255, 255, 0.3),
        inset 0 -1px 1px rgba(255, 255, 255, 0.05);
      padding: 36px 22px;
      text-align: center;
    }

    /* Profile Avatar with Liquid Glass Ring */
    .avatar-wrapper {
      position: relative;
      width: 116px;
      height: 116px;
      margin: 0 auto 16px;
    }

    .profile-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      border: 2px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 8px 30px rgba(14, 165, 233, 0.4);
      transition: transform 0.4s ease;
    }

    .avatar-wrapper:hover .profile-img {
      transform: scale(1.05);
    }

    h1 {
      font-size: 23px;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 5px;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 13px;
      color: rgba(241, 245, 249, 0.7);
      margin-bottom: 24px;
      font-weight: 400;
    }

    /* Liquid Glass Save Contact Button */
    .save-contact-btn {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.75), rgba(5, 150, 105, 0.85));
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #ffffff;
      padding: 14px;
      border-radius: 18px;
      font-size: 15px;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.35);
      cursor: pointer;
      box-shadow: 
        0 10px 25px rgba(16, 185, 129, 0.35),
        inset 0 1px 1px rgba(255, 255, 255, 0.4);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      margin-bottom: 22px;
    }

    .save-contact-btn:hover {
      transform: translateY(-2px);
      box-shadow: 
        0 14px 30px rgba(16, 185, 129, 0.5),
        inset 0 1px 1px rgba(255, 255, 255, 0.6);
    }

    .save-contact-btn i {
      animation: pulseIcon 2s infinite ease-in-out;
    }

    /* Links Container */
    .links-list {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    /* Glass Link Pill */
    .link-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 18px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      color: #f1f5f9;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 
        0 4px 15px rgba(0, 0, 0, 0.15),
        inset 0 1px 1px rgba(255, 255, 255, 0.1);
    }

    .link-item:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px) scale(1.01);
      box-shadow: 
        0 10px 25px rgba(0, 0, 0, 0.3),
        inset 0 1px 2px rgba(255, 255, 255, 0.25);
    }

    .link-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* Icon Animation */
    .link-left i {
      font-size: 20px;
      width: 24px;
      text-align: center;
      display: inline-block;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .link-item:hover .link-left i {
      transform: scale(1.3) rotate(-8deg);
    }

    @keyframes pulseIcon {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    /* Vibrant Brand Colors */
    .fa-whatsapp { color: #25d366; }
    .fa-phone { color: #38bdf8; }
    .fa-envelope { color: #f87171; }
    .fa-instagram { color: #f43f5e; }
    .fa-threads { color: #ffffff; }
    .fa-telegram { color: #38bdf8; }
    .fa-youtube { color: #ef4444; }
    .fa-x-twitter { color: #f1f5f9; }

    .fa-chevron-right {
      color: rgba(255, 255, 255, 0.3);
      font-size: 12px;
      transition: transform 0.25s ease, color 0.25s ease;
    }

    .link-item:hover .fa-chevron-right {
      transform: translateX(4px);
      color: #38bdf8;
    }

    footer {
      margin-top: 26px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 0.3px;
    }
  </style>
</head>

  <!-- JavaScript vCard Generator -->
  <script>
    function downloadVCard() {
      const vcard = 
`BEGIN:VCARD
VERSION:3.0
N:Kumar;Shivaji;;;
FN:Shivaji Kumar
ORG:Personal
TITLE:Packaging Operator & Tech Enthusiast
TEL;TYPE=CELL,VOICE:+919792156988
EMAIL;TYPE=INTERNET:shivajiraoamihit786@gmail.com
URL:https://shivajiamihit.in
ADR;TYPE=HOME:;;Amihit, Kerakat;Jaunpur;Uttar Pradesh;222142;India
END:VCARD`;

      const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const tempLink = document.createElement('a');
      tempLink.href = url;
      tempLink.setAttribute('download', 'Shivaji_Kumar.vcf');
      document.body.appendChild(tempLink);
      tempLink.click();
      document.body.removeChild(tempLink);
      URL.revokeObjectURL(url);
    }
  </script>
