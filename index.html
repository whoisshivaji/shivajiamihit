<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SHIVAJI | Tools & Apps</title>
  <meta name="title" content="SHIVAJI | Tools & Apps">
  <meta name="description" content="Personal minimal tools hub by Shivaji.">

  <!-- Google Fonts & Font Awesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-color: #f1f7f3;
      --card-bg: #ffffff;
      --pista-primary: #52796f;
      --pista-dark: #2f3e46;
      --pista-light: #84a98c;
      --pista-subtle: #cad2c5;
      --pista-accent: #354f52;
      --text-main: #1f2d27;
      --text-muted: #5c7166;
      --border-color: #d8e2dc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 16px 40px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Top Profile Header */
    .top-header {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(47, 62, 70, 0.04);
    }

    .profile-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar-mini {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid var(--pista-light);
      background: var(--pista-subtle);
    }

    .avatar-mini img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .brand-title {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 1.2px;
      color: var(--pista-dark);
      text-transform: uppercase;
    }

    .badge-status {
      font-size: 11px;
      font-weight: 600;
      color: var(--pista-primary);
      background: #e3ede6;
      padding: 4px 10px;
      border-radius: 30px;
      border: 1px solid var(--border-color);
    }

    /* Precision Clock Card */
    .clock-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 16px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(47, 62, 70, 0.04);
    }

    .date-display {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
    }

    .time-main {
      font-family: 'JetBrains Mono', monospace;
      font-size: 26px;
      font-weight: 700;
      color: var(--pista-dark);
      letter-spacing: -0.5px;
      line-height: 1.1;
    }

    .time-nano {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      color: var(--pista-primary);
      background: #eef5f0;
      display: inline-block;
      padding: 3px 8px;
      border-radius: 8px;
      margin-top: 6px;
      border: 1px solid var(--border-color);
    }

    /* Section Header */
    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 4px 4px 0;
    }

    .app-counter {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 10.5px;
      color: var(--pista-dark);
      font-weight: 600;
    }

    /* Apps Grid (2 Columns, Minimal Pista Design) */
    .apps-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      min-height: 150px;
    }

    .app-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 18px 12px;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(47, 62, 70, 0.03);
    }

    .app-card:hover, .app-card:active {
      transform: translateY(-2px);
      border-color: var(--pista-light);
      box-shadow: 0 6px 15px rgba(82, 121, 111, 0.1);
    }

    .app-icon {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: #edf4ef;
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      color: var(--pista-primary);
      margin-bottom: 10px;
      transition: background 0.2s, color 0.2s;
    }

    .app-card:hover .app-icon {
      background: var(--pista-primary);
      color: #ffffff;
    }

    .app-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      text-align: center;
      line-height: 1.3;
      margin-bottom: 2px;
    }

    .app-desc {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: capitalize;
    }

    .loading-box {
      grid-column: span 2;
      text-align: center;
      padding: 30px;
      color: var(--text-muted);
      font-size: 13px;
    }

    /* Footer with Small Circular Instagram Logo */
    footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 14px;
      padding-top: 10px;
    }

    .insta-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--pista-primary);
      text-decoration: none;
      font-size: 15px;
      box-shadow: 0 2px 6px rgba(47, 62, 70, 0.05);
      transition: all 0.2s ease;
    }

    .insta-btn:hover {
      background: var(--pista-primary);
      color: #ffffff;
      border-color: var(--pista-primary);
      transform: scale(1.08);
    }

    .copyright-text {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Top Header: Avatar + SHIVAJI -->
    <header class="top-header">
      <div class="profile-group">
        <div class="avatar-mini">
          <img src="profile.jpg" alt="Shivaji" onerror="this.src='https://ui-avatars.com/api/?name=Shivaji&background=cad2c5&color=2f3e46'">
        </div>
        <div class="brand-title">SHIVAJI</div>
      </div>
      <div class="badge-status">Online</div>
    </header>

    <!-- Real-time Precision Clock (Date + Time + Sec + Micro + Nano) -->
    <div class="clock-card">
      <div class="date-display" id="dateDisplay">Loading date...</div>
      <div class="time-main" id="timeDisplay">00:00:00</div>
      <div class="time-nano" id="nanoDisplay">.000000000 s</div>
    </div>

    <!-- Section Title -->
    <div class="section-title">
      <span>Applications</span>
      <span class="app-counter" id="appCounter">Syncing...</span>
    </div>

    <!-- Dynamic Apps Grid (Live GitHub Sync) -->
    <div class="apps-grid" id="appsGrid">
      <div class="loading-box">
        <i class="fa-solid fa-spinner fa-spin" style="font-size: 20px; color: var(--pista-primary); margin-bottom: 8px;"></i>
        <p>Loading tools...</p>
      </div>
    </div>

    <!-- Footer: Small Circular Instagram Link -->
    <footer>
      <a href="https://instagram.com/who_is_shivaji" target="_blank" rel="noopener noreferrer" class="insta-btn" title="Follow on Instagram">
        <i class="fa-brands fa-instagram"></i>
      </a>
      <div class="copyright-text">© 2026 SHIVAJI</div>
    </footer>

  </div>

  <script>
    // --- 1. Real-Time High Precision Clock ---
    let perfOrigin = performance.timeOrigin || performance.timing.navigationStart;

    function updatePrecisionClock() {
      const now = new Date();

      // Format Date
      const options = { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' };
      document.getElementById('dateDisplay').textContent = now.toLocaleDateString('en-IN', options);

      // Time: HH:MM:SS
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('timeDisplay').textContent = `${hh}:${mm}:${ss}`;

      // Microseconds & Nanoseconds via High-Resolution Timer
      const accurateMs = (perfOrigin + performance.now()) % 1000;
      const ms = Math.floor(accurateMs);
      const frac = accurateMs - ms;
      const micros = Math.floor(frac * 1000);
      const nanos = Math.floor((frac * 1000 - micros) * 1000);

      const msStr = String(ms).padStart(3, '0');
      const usStr = String(micros).padStart(3, '0');
      const nsStr = String(nanos).padStart(3, '0');

      document.getElementById('nanoDisplay').textContent = `.${msStr}${usStr}${nsStr} ns`;

      requestAnimationFrame(updatePrecisionClock);
    }
    requestAnimationFrame(updatePrecisionClock);

    // --- 2. Live GitHub Dynamic Tool Sync (Add & Remove) ---
    const GITHUB_USER = 'whoisshivaji';
    const GITHUB_REPO = 'shivajiamihit';
    const grid = document.getElementById('appsGrid');
    const counter = document.getElementById('appCounter');

    function resolveAppInfo(filename) {
      const lower = filename.toLowerCase();

      if (lower.includes('ludo')) return { title: 'Play Ludo 🎲', desc: 'Game', icon: 'fa-dice' };
      if (lower.includes('aichat')) return { title: 'AI Chatbot', desc: 'Smart Assistant', icon: 'fa-robot' };
      if (lower.includes('life')) return { title: 'Life Calculator', desc: 'Age & Stats', icon: 'fa-heart-pulse' };
      if (lower.includes('calc')) return { title: 'Smart Calculator', desc: 'Math Utility', icon: 'fa-calculator' };
      if (lower.includes('dslr') || lower.includes('blur')) return { title: 'DSLR Blur', desc: 'Photo Editor', icon: 'fa-camera-retro' };
      if (lower.includes('download')) return { title: 'Downloader', desc: 'Media Tool', icon: 'fa-circle-arrow-down' };
      if (lower.includes('vector')) return { title: 'Vector Portrait', desc: 'Vector Utility', icon: 'fa-palette' };
      if (lower.includes('portrait')) return { title: 'Portrait Tool', desc: 'Photo FX', icon: 'fa-wand-magic-sparkles' };
      if (lower.includes('qr')) return { title: 'QR Tool', desc: 'Code Generator', icon: 'fa-qrcode' };
      if (lower.includes('video')) return { title: 'Video Player', desc: 'Media Stream', icon: 'fa-circle-play' };
      if (lower.includes('chat')) return { title: 'Live Chat', desc: 'Messenger', icon: 'fa-comments' };

      const cleanName = filename.replace(/\.html$/i, '').replace(/[-_]/g, ' ');
      const capitalized = cleanName.charAt(0).toUpperCase() + cleanName.slice(1);
      return { title: capitalized, desc: 'Web App', icon: 'fa-cube' };
    }

    async function syncApps() {
      try {
        const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/?t=${Date.now()}`);
        if (!response.ok) throw new Error('API fetch error');
        const files = await response.json();

        const validTools = files.filter(file => {
          if (file.type !== 'file') return false;
          const name = file.name.toLowerCase();
          return name.endsWith('.html') && name !== 'index.html' && name !== 'lifecalculator.html';
        });

        grid.innerHTML = '';
        validTools.forEach(file => {
          const meta = resolveAppInfo(file.name);
          const card = document.createElement('a');
          card.href = file.name;
          card.className = 'app-card';
          card.innerHTML = `
            <div class="app-icon"><i class="fa-solid ${meta.icon}"></i></div>
            <div class="app-title">${meta.title}</div>
            <div class="app-desc">${meta.desc}</div>
          `;
          grid.appendChild(card);
        });

        counter.textContent = validTools.length + ' Apps';
        localStorage.setItem('cached_pista_tools', JSON.stringify(validTools.map(f => f.name)));

      } catch (err) {
        const cached = JSON.parse(localStorage.getItem('cached_pista_tools') || '[]');
        if (cached.length > 0) {
          grid.innerHTML = '';
          cached.forEach(fileName => {
            const meta = resolveAppInfo(fileName);
            const card = document.createElement('a');
            card.href = fileName;
            card.className = 'app-card';
            card.innerHTML = `
              <div class="app-icon"><i class="fa-solid ${meta.icon}"></i></div>
              <div class="app-title">${meta.title}</div>
              <div class="app-desc">${meta.desc}</div>
            `;
            grid.appendChild(card);
          });
          counter.textContent = cached.length + ' Apps';
        } else {
          grid.innerHTML = '<div class="loading-box"><p>Unable to load apps. Please refresh.</p></div>';
        }
      }
    }

    syncApps();
  </script>

</body>
</html>
