<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Search Engine Meta Tags -->

  <meta name="title" content="Shivaji Kumar | Official Portfolio">
  <meta name="description" content="Official personal portfolio of Shivaji Kumar - Tech Enthusiast, Packaging Operator & Web Developer.">

  <!-- Open Graph / WhatsApp / Facebook Preview Tags -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://shivajiamihit.in/">
  <meta property="og:title" content="Shivaji Kumar | Official Portfolio">
  <meta property="og:description" content="Connect with Shivaji. View my portfolio, contact details, and social links.">
  <meta property="og:image" content="https://shivajiamihit.in/profile.jpg">

  <!-- Twitter / X Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://shivajiamihit.in/">
  <meta name="twitter:title" content="Shivaji Kumar | Official Portfolio">
  <meta name="twitter:description" content="Connect with Shivaji. View my portfolio, contact details, and social links.">
  <meta name="twitter:image" content="https://shivajiamihit.in/profile.jpg">

  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background: #030712;
      color: #f9fafb;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* Animated Liquid Blobs in Background */
    .liquid-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      opacity: 0.6;
      pointer-events: none;
      animation: floatOrb 12s infinite alternate ease-in-out;
    }

    .orb-1 {
      width: 320px;
      height: 320px;
      background: linear-gradient(135deg, #0ea5e9, #38bdf8);
      top: -60px;
      left: -60px;
    }

    .orb-2 {
      width: 380px;
      height: 380px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      bottom: -80px;
      right: -80px;
      animation-duration: 16s;
    }

    .orb-3 {
      width: 250px;
      height: 250px;
      background: linear-gradient(135deg, #e11d48, #fb7185);
      top: 45%;
      left: 60%;
      animation-duration: 10s;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, 40px) scale(1.15); }
      100% { transform: translate(-30px, -20px) scale(0.95); }
    }

    @media (prefers-reduced-motion: reduce) {
      .liquid-orb, .save-contact-btn i { animation: none; }
    }

    /* Liquid Glass Card Container */
    .glass-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(24px) saturate(190%);
      -webkit-backdrop-filter: blur(24px) saturate(190%);
      border-radius: 32px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.6),
        inset 0 1px 1px rgba(255, 255, 255, 0.3),
        inset 0 -1px 1px rgba(255, 255, 255, 0.05);
      padding: 36px 22px;
      text-align: center;
    }

    /* Profile Avatar */
    .avatar-wrapper {
      position: relative;
      width: 116px;
      height: 116px;
      margin: 0 auto 16px;
    }

    .profile-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      border: 2px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 8px 30px rgba(14, 165, 233, 0.4);
      transition: transform 0.4s ease;
    }

    .avatar-wrapper:hover .profile-img {
      transform: scale(1.05);
    }

    h1 {
      font-size: 23px;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 5px;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 13px;
      color: rgba(241, 245, 249, 0.7);
      margin-bottom: 24px;
      font-weight: 400;
    }

    /* Save Contact Button */
    .save-contact-btn {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.75), rgba(5, 150, 105, 0.85));
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #ffffff;
      padding: 14px;
      border-radius: 18px;
      font-size: 15px;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.35);
      cursor: pointer;
      box-shadow:
        0 10px 25px rgba(16, 185, 129, 0.35),
        inset 0 1px 1px rgba(255, 255, 255, 0.4);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      margin-bottom: 22px;
    }

    .save-contact-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(16, 185, 129, 0.5);
    }

    .save-contact-btn i {
      animation: pulseIcon 2s infinite ease-in-out;
    }

    /* Links Container */
    .links-list {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    /* Glass Link Pill */
    .link-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 13px 18px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      color: #f1f5f9;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      text-align: left;
      transition: all 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow:
        0 4px 15px rgba(0, 0, 0, 0.15),
        inset 0 1px 1px rgba(255, 255, 255, 0.1);
      cursor: pointer;
      user-select: none;
    }

    .link-item:hover,
    .link-item:focus-visible {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px) scale(1.01);
      box-shadow:
        0 10px 25px rgba(0, 0, 0, 0.3),
        inset 0 1px 2px rgba(255, 255, 255, 0.25);
      outline: none;
    }

    .link-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .link-left i {
      font-size: 20px;
      width: 24px;
      text-align: center;
      display: inline-block;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .link-item:hover .link-left i {
      transform: scale(1.3) rotate(-8deg);
    }

    @keyframes pulseIcon {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    /* Special Highlight for Explore Movies Button */
    .movie-btn-item {
      background: linear-gradient(135deg, rgba(225, 29, 72, 0.2), rgba(168, 85, 247, 0.2));
      border: 1px solid rgba(244, 63, 94, 0.45);
    }

    .movie-btn-item:hover,
    .movie-btn-item:focus-visible {
      background: linear-gradient(135deg, rgba(225, 29, 72, 0.35), rgba(168, 85, 247, 0.35));
      border-color: rgba(244, 63, 94, 0.8);
    }

    /* Brand Colors */
    .fa-whatsapp { color: #25d366; }
    .fa-phone { color: #38bdf8; }
    .fa-envelope { color: #f87171; }
    .fa-instagram { color: #f43f5e; }
    .fa-telegram { color: #38bdf8; }
    .fa-x-twitter { color: #f1f5f9; }
    .fa-film { color: #fb7185; }

    .fa-chevron-right {
      color: rgba(255, 255, 255, 0.3);
      font-size: 12px;
      transition: transform 0.25s ease, color 0.25s ease;
    }

    .link-item:hover .fa-chevron-right {
      transform: translateX(4px);
      color: #38bdf8;
    }

    footer {
      margin-top: 26px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 0.3px;
    }

    /* ========================================= */
    /* Liquid Glass Movies Window / Modal        */
    /* ========================================= */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(3, 7, 18, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      padding: 16px;
    }

    .modal-overlay.active {
      display: flex;
      animation: fadeIn 0.25s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-glass {
      width: 100%;
      max-width: 440px;
      height: 82vh;
      height: 82dvh;
      display: flex;
      flex-direction: column;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(30px) saturate(200%);
      -webkit-backdrop-filter: blur(30px) saturate(200%);
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85);
      padding: 20px;
      position: relative;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      flex-shrink: 0;
    }

    .modal-header h2 {
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #f8fafc;
    }

    .close-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #cbd5e1;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.2s;
    }

    .close-btn:hover {
      background: rgba(239, 68, 68, 0.4);
      color: #fff;
    }

    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-shrink: 0;
    }

    .search-input {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 14px;
      color: #fff;
      font-size: 16px; /* 16px stops iOS auto-zoom on focus */
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: #fb7185;
    }

    .search-btn {
      background: linear-gradient(135deg, #e11d48, #fb7185);
      border: none;
      border-radius: 14px;
      color: #fff;
      padding: 0 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .search-btn:hover {
      transform: scale(1.05);
    }

    .movie-results {
      overflow-y: auto;
      flex: 1;
      text-align: left;
      padding-right: 4px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .movie-results::-webkit-scrollbar {
      width: 4px;
    }
    .movie-results::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.25);
      border-radius: 4px;
    }

    .movie-item {
      display: flex;
      gap: 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 10px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .movie-item:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(251, 113, 133, 0.4);
    }

    .movie-poster {
      width: 70px;
      height: 98px;
      object-fit: cover;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.4);
      flex-shrink: 0;
    }

    .movie-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .movie-title {
      font-size: 14px;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 4px;
      line-height: 1.25;
    }

    .movie-meta {
      font-size: 11px;
      color: #fb7185;
      margin-bottom: 6px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .movie-meta span {
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 6px;
      border-radius: 6px;
      color: #cbd5e1;
    }

    .movie-summary {
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .error-box {
      text-align: center;
      padding: 35px 10px;
      color: #94a3b8;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <!-- Liquid Floating Orbs -->
  <div class="liquid-orb orb-1"></div>
  <div class="liquid-orb orb-2"></div>
  <div class="liquid-orb orb-3"></div>

  <!-- Main Profile Card -->
  <div class="glass-card">

    <!-- Profile Photo -->
    <div class="avatar-wrapper">
      <img src="profile.jpg" alt="Shivaji" class="profile-img"
           onerror="this.onerror=null;this.src='https://ui-avatars.com/api/?name=Shivaji+Kumar&background=0284c7&color=ffffff&size=200'">
    </div>

    <h1>Shivaji Kumar</h1>
    <p class="subtitle">Operator &amp; Tech Enthusiast | Amihit, Jaunpur</p>

    <!-- Save Contact Button -->
    <button type="button" onclick="downloadVCard()" class="save-contact-btn">
      <i class="fa-solid fa-address-card"></i> Save Contact
    </button>

    <!-- Social & Tool Links -->
    <div class="links-list">

      <!-- WhatsApp -->
      <a href="https://api.whatsapp.com/send?phone=919792156988&text=Hi%20Shivaji!" target="_blank" rel="noopener" class="link-item">
        <div class="link-left">
          <i class="fa-brands fa-whatsapp"></i>
          <span>WhatsApp</span>
        </div>
        <i class="fa-solid fa-chevron-right"></i>
      </a>

      <!-- Call Me -->
      <a href="tel:+919792156988" class="link-item">
        <div class="link-left">
          <i class="fa-solid fa-phone"></i>
          <span>Call Me</span>
        </div>
        <i class="fa-solid fa-chevron-right"></i>
      </a>

      <!-- Email Me -->
      <a href="mailto:shivajiraoamihit786@gmail.com?subject=Contact%20from%20Portfolio" class="link-item">
        <div class="link-left">
          <i class="fa-solid fa-envelope"></i>
          <span>Email Me</span>
        </div>
        <i class="fa-solid fa-chevron-right"></i>
      </a>

      <!-- Instagram -->
      <a href="https://instagram.com/who_is_shivaji" target="_blank" rel="noopener" class="link-item">
        <div class="link-left">
          <i class="fa-brands fa-instagram"></i>
          <span>Instagram</span>
        </div>
        <i class="fa-solid fa-chevron-right"></i>
      </a>

      <!-- Telegram -->
      <a href="https://t.me/Whoisshivaji" target="_blank" rel="noopener" class="link-item">
        <div class="link-left">
          <i class="fa-brands fa-telegram"></i>
          <span>Telegram</span>
        </div>
        <i class="fa-solid fa-chevron-right"></i>
      </a>

      <!-- Twitter / X -->
      <a href="https://x.com/who_is_shivaji" target="_blank" rel="noopener" class="link-item">
        <div class="link-left">
          <i class="fa-brands fa-x-twitter"></i>
          <span>Twitter (X)</span>
        </div>
        <i class="fa-solid fa-chevron-right"></i>
      </a>

      <!-- Explore Movies Tool Button -->
      <button type="button" class="link-item movie-btn-item" id="openMoviesBtn">
        <div class="link-left">
          <i class="fa-solid fa-film"></i>
          <span>Explore Movies</span>
        </div>
        <i class="fa-solid fa-chevron-right"></i>
      </button>

    </div>

    <footer>
      © 2026 shivajiamihit.in • All Rights Reserved
    </footer>
  </div>

  <!-- Liquid Glass Explore Movies Modal Window -->
  <div class="modal-overlay" id="movieModal">
    <div class="modal-glass">
      <div class="modal-header">
        <h2><i class="fa-solid fa-film" style="color:#fb7185;"></i> Explore Movies</h2>
        <button type="button" class="close-btn" id="closeMoviesBtn" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="search-box">
        <input type="text" id="movieInput" class="search-input" placeholder="Search movie (e.g. Avatar, Avengers)...">
        <button type="button" class="search-btn" id="searchMoviesBtn" aria-label="Search"><i class="fa-solid fa-magnifying-glass"></i></button>
      </div>

      <div class="movie-results" id="movieResults">
        <div class="error-box">
          <i class="fa-solid fa-spinner fa-spin" style="font-size:24px; color:#fb7185;"></i>
          <p style="margin-top:8px;">Loading movies...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script>
    // Save Contact (vCard)
    function downloadVCard() {
      const vcard = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        'N:Kumar;Shivaji;;;',
        'FN:Shivaji Kumar',
        'ORG:Personal',
        'TITLE:Packaging Operator & Tech Enthusiast',
        'TEL;TYPE=CELL,VOICE:+919792156988',
        'EMAIL;TYPE=INTERNET:shivajiraoamihit786@gmail.com',
        'URL:https://shivajiamihit.in',
        'ADR;TYPE=HOME:;;Amihit, Kerakat;Jaunpur;Uttar Pradesh;222142;India',
        'END:VCARD'
      ].join('\r\n');

      const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const tempLink = document.createElement('a');
      tempLink.href = url;
      tempLink.setAttribute('download', 'Shivaji_Kumar.vcf');
      document.body.appendChild(tempLink);
      tempLink.click();
      document.body.removeChild(tempLink);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // Modal Control
    const modal = document.getElementById('movieModal');
    const openBtn = document.getElementById('openMoviesBtn');
    const closeBtn = document.getElementById('closeMoviesBtn');
    const searchBtn = document.getElementById('searchMoviesBtn');
    const movieInput = document.getElementById('movieInput');

    function openModal() {
      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
      if (!movieInput.value.trim()) {
        fetchMovieData('avengers');
      }
      setTimeout(() => movieInput.focus(), 100);
    }

    function closeModal() {
      modal.classList.remove('active');
      document.body.style.overflow = '';
    }

    openBtn.addEventListener('click', openModal);
    closeBtn.addEventListener('click', closeModal);

    modal.addEventListener('click', function (e) {
      if (e.target === modal) closeModal();
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeModal();
    });

    function runSearch() {
      const val = movieInput.value.trim();
      if (val) fetchMovieData(val);
    }

    searchBtn.addEventListener('click', runSearch);
    movieInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') runSearch();
    });

    // Escape HTML so API text can never break the page
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // Movie search (iTunes Search API - real movies, free, no key)
    let searchToken = 0;
    async function fetchMovieData(query) {
      const box = document.getElementById('movieResults');
      const myToken = ++searchToken;
      box.innerHTML = '<div class="error-box"><i class="fa-solid fa-spinner fa-spin" style="font-size:24px;color:#fb7185;"></i><p style="margin-top:8px;">Searching movies...</p></div>';

      try {
        const res = await fetch('https://itunes.apple.com/search?media=movie&limit=20&term=' + encodeURIComponent(query));
        if (!res.ok) throw new Error('Network error');
        const data = await res.json();
        if (myToken !== searchToken) return; // a newer search is running

        const results = (data.results || []).filter(m => m.trackName);

        if (!results.length) {
          box.innerHTML = '<div class="error-box"><i class="fa-solid fa-circle-question" style="font-size:26px;color:#fb7185;margin-bottom:8px;"></i><p>Koi movie nahi mili. Kuch aur search karein.</p></div>';
          return;
        }

        box.innerHTML = results.map(m => {
          const poster = (m.artworkUrl100 || '').replace('100x100bb', '300x300bb');
          const year = (m.releaseDate || '').slice(0, 4);
          return `
            <div class="movie-item">
              <img class="movie-poster" src="${esc(poster)}" alt="${esc(m.trackName)}" loading="lazy" onerror="this.style.visibility='hidden'">
              <div class="movie-info">
                <div class="movie-title">${esc(m.trackName)}</div>
                <div class="movie-meta">
                  ${year ? `<span>${esc(year)}</span>` : ''}
                  ${m.primaryGenreName ? `<span>${esc(m.primaryGenreName)}</span>` : ''}
                </div>
                <div class="movie-summary">${esc(m.longDescription || m.shortDescription || '')}</div>
              </div>
            </div>`;
        }).join('');
      } catch (err) {
        if (myToken !== searchToken) return;
        box.innerHTML = '<div class="error-box"><i class="fa-solid fa-triangle-exclamation" style="font-size:26px;color:#fb7185;margin-bottom:8px;"></i><p>Movies load nahi ho paayi. Dobara try karein.</p></div>';
      }
    }
  </script>

</body>
</html>
